<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Агент</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="project-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect width="16" height="16" rx="3" fill="#3b82f6"/>
          <path d="M4 4h8M4 8h8M4 12h5" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="project-name" id="projectName">МойПроект</span>
      <button class="run-btn" id="runBtn" title="Запустить">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M3 2l7 4-7 4V2z" fill="#4ade80"/>
        </svg>
      </button>
      <button class="upgrade-btn">+ Улучшить</button>
    </div>
    <div class="topbar-tabs">
      <button class="tab active" data-tab="tools">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M9.5 1.5L11.5 3.5L5 10L2 11L3 8L9.5 1.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
        Инструменты
      </button>
      <button class="tab" data-tab="preview">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <rect x="1.5" y="2.5" width="10" height="8" rx="1.2" stroke="currentColor" stroke-width="1.2"/>
          <path d="M4.5 5.5l2 2 2-2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        Превью
      </button>
      <button class="tab tab-plus" data-tab="new">+</button>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="settingsBtn" title="Настройки">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="7" cy="7" r="2.5" stroke="currentColor" stroke-width="1.2"/>
          <path d="M7 1.5v2M7 10.5v2M1.5 7h2M10.5 7h2M3.05 3.05l1.4 1.4M9.55 9.55l1.4 1.4M3.05 10.95l1.4-1.4M9.55 4.45l1.4-1.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="workspace">
    <!-- Left sidebar icons -->
    <aside class="sidebar">
      <button class="side-btn active" title="Чат">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M3 3h12v10H9.5L6 16v-3H3V3z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="side-btn" title="Файлы">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M4 2h6l4 4v10H4V2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M10 2v4h4" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="side-btn" title="Поиск">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.3"/>
          <path d="M12 12l3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="side-btn side-add" title="Добавить">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M9 4v10M4 9h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </aside>

    <!-- Chat panel -->
    <div class="chat-panel" id="chatPanel">
      <div class="messages" id="messages"></div>

      <!-- Input area -->
      <div class="input-area">
        <div class="input-box">
          <textarea
            id="userInput"
            placeholder="Напишите задачу или вопрос..."
            rows="1"
            maxlength="8000"
          ></textarea>
          <div class="input-actions-top">
            <button class="attach-btn" title="Прикрепить файл">
              <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
                <path d="M12.5 7L7 12.5A4 4 0 012.5 8L8 2.5A2.5 2.5 0 0111.5 6L6 11.5A1 1 0 014.5 10L9 5.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
            </button>
            <button class="img-btn" title="Изображение">
              <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
                <rect x="1.5" y="2.5" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
                <circle cx="5" cy="6" r="1" fill="currentColor"/>
                <path d="M1.5 10l3.5-3 3 3 2-2 3 2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="input-footer">
          <div class="footer-left">
            <div class="model-selector" id="modelSelector">
              <span class="model-dot" id="modelDot"></span>
              <span id="modelLabel">Авто</span>
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                <path d="M2.5 4l2.5 2.5L7.5 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
            </div>
            <label class="plan-toggle">
              <input type="checkbox" id="planMode" />
              <span class="toggle-slider"></span>
              <span class="toggle-label">Планировщик</span>
            </label>
            <button class="mic-btn" id="micBtn" title="Голосовой ввод">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <rect x="4.5" y="1" width="5" height="8" rx="2.5" stroke="currentColor" stroke-width="1.2"/>
                <path d="M2 7.5A5 5 0 0012 7.5M7 12v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="footer-right">
            <button class="send-btn" id="sendBtn" title="Отправить">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M14 2L2 7.5 7.5 9M14 2L9 14l-1.5-5M14 2L7.5 9" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Right panel: Preview / Tools / Canvas -->
    <div class="right-panel" id="rightPanel">
      <div class="right-panel-inner tools-view active" id="toolsView">
        <!-- Canvas tab indicator -->
        <div class="canvas-label">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <rect x="1" y="1" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.2"/>
            <path d="M3 6h6M6 3v6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
          </svg>
          Холст
        </div>
        <div class="canvas-area" id="canvasArea">
          <div class="canvas-empty">
            <div class="canvas-icon">
              <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                <rect x="4" y="4" width="32" height="32" rx="6" stroke="#3b4258" stroke-width="2"/>
                <path d="M13 20h14M20 13v14" stroke="#3b4258" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
            <p>Холст пуст</p>
            <span>Здесь будут отображаться результаты</span>
          </div>
        </div>
      </div>

      <div class="right-panel-inner preview-view" id="previewView">
        <div class="preview-toolbar">
          <div class="preview-url-bar">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.1"/>
              <path d="M6 2.5C6 2.5 4 5 4 6s2 3.5 2 3.5M6 2.5C6 2.5 8 5 8 6s-2 3.5-2 3.5M2.5 6h7" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
            </svg>
            <span id="previewUrl">localhost:5000</span>
          </div>
          <button class="preview-refresh" title="Обновить">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
              <path d="M11 6.5A4.5 4.5 0 112 6.5M11 3v3.5H7.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <iframe id="previewFrame" src="about:blank" title="Превью"></iframe>
      </div>
    </div>
  </div>

  <!-- Model picker dropdown -->
  <div class="dropdown" id="modelDropdown"></div>

  <!-- Settings panel -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <span>Настройки агента</span>
      <button id="closeSettings">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M2 2l8 8M10 2L2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="settings-body">
      <div class="settings-section">
        <h3>Модели и провайдеры</h3>
        <p class="settings-hint">Ключ OpenAI уже подключен. Для других провайдеров добавьте API-ключи в секреты.</p>
        <div class="provider-grid" id="providerGrid"></div>
      </div>
      <div class="settings-section">
        <h3>Автообнаружение моделей</h3>
        <p class="settings-hint">Приложение проверяет доступные модели и обновляет список.</p>
        <button class="scan-btn" id="scanModels">Сканировать модели</button>
        <div class="scan-status" id="scanStatus"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
