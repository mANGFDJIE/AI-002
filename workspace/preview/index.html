<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI — голубые оттенки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #e0f7fa 0%, #b2ebf2 40%, #80deea 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* декоративные элементы */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.25;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
        }
        .bg-shape:nth-child(1) {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, #4dd0e1, transparent);
            top: -60px;
            left: -80px;
            animation-delay: 0s;
        }
        .bg-shape:nth-child(2) {
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, #00bcd4, transparent);
            bottom: -40px;
            right: -40px;
            animation-delay: 3s;
        }
        .bg-shape:nth-child(3) {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #26c6da, transparent);
            top: 20%;
            right: 10%;
            animation-delay: 5s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-24px) scale(1.05); }
        }

        .card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 40px;
            padding: 52px 44px 44px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 56px -12px rgba(0, 150, 200, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.3);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            position: relative;
            z-index: 1;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 28px 64px -12px rgba(0, 150, 200, 0.35);
        }

        .badge {
            display: inline-block;
            background: rgba(0, 188, 212, 0.12);
            color: #00838f;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid rgba(0, 188, 212, 0.2);
            margin-bottom: 16px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            color: #006064;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .sub {
            color: #00838f;
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 36px;
            opacity: 0.75;
        }

        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 32px;
        }

        .feature {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            padding: 18px 14px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0, 200, 220, 0.15);
            transition: background 0.2s, border-color 0.2s;
            text-align: center;
        }
        .feature:hover {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(0, 188, 212, 0.35);
        }
        .feature .icon {
            font-size: 28px;
            margin-bottom: 6px;
        }
        .feature span {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #006064;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00acc1, #00bcd4);
            border: none;
            border-radius: 30px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(0, 150, 200, 0.25);
        }
        .btn:hover {
            background: linear-gradient(135deg, #00838f, #00acc1);
            transform: scale(1.02);
            box-shadow: 0 10px 28px rgba(0, 150, 200, 0.35);
        }
        .btn:active {
            transform: scale(0.97);
        }

        .status {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #006064;
            min-height: 22px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .status.active {
            opacity: 1;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .card { padding: 32px 20px 28px; }
            h1 { font-size: 28px; }
            .features { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>

    <div class="card">
        <div class="badge">✦ AI beta</div>
        <h1>Нейро-помощник</h1>
        <p class="sub">Голубой интеллект, обученный на передовых моделях</p>

        <div class="features">
            <div class="feature">
                <div class="icon">🧠</div>
                <span>Распознавание</span>
            </div>
            <div class="feature">
                <div class="icon">⚡</div>
                <span>Генерация</span>
            </div>
            <div class="feature">
                <div class="icon">📊</div>
                <span>Анализ</span>
            </div>
            <div class="feature">
                <div class="icon">🌐</div>
                <span>Интеграция</span>
            </div>
        </div>

        <button class="btn" id="actionBtn">Запустить сессию</button>
        <div class="status" id="status">Готов к работе</div>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const status = document.getElementById('status');
        let count = 0;

        btn.addEventListener('click', () => {
            count++;
            const messages = [
                '⚙️ Инициализация нейросети…',
                '📡 Установлено соединение с облаком',
                '✅ Модель готова к запросам',
                '🌀 Обработка завершена (демо)'
            ];
            status.textContent = messages[count % messages.length];
            status.classList.add('active');
        });
    </script>
</body>
</html>
