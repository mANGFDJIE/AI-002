<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LOFT — Landing</title>
  <style>
    :root{
      --bg:#f5efe6;
      --card:#ffffff;
      --muted:#6b7280;
      --accent:#238636;
      --accent-hover:#2ea043;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      color:#111827;
    }
    .card{
      width:100%;
      max-width:880px;
      background:var(--card);
      border-radius:16px;
      padding:36px;
      box-shadow:0 10px 30px rgba(19,19,19,0.06);
      display:flex;
      gap:24px;
      align-items:center;
    }
    .brand{
      flex:1;
    }
    h1{
      margin:0 0 8px 0;
      font-size:28px;
      letter-spacing:-0.02em;
    }
    p.lead{
      margin:0;
      color:var(--muted);
    }
    .actions{
      display:flex;
      gap:12px;
      align-items:center;
    }
    .btn{
      display:inline-block;
      padding:10px 16px;
      border-radius:10px;
      font-weight:600;
      font-size:14px;
      text-decoration:none;
      color:#fff;
      background:var(--accent);
      border:1px solid rgba(0,0,0,0.05);
      cursor:pointer;
      transition:background .15s, transform .08s;
    }
    .btn.secondary{
      background:#ffffff;
      color:#111827;
      border:1px solid #e5e7eb;
    }
    .btn:hover{background:var(--accent-hover)}
    .btn.secondary:hover{transform:translateY(-2px)}
    @media (max-width:640px){
      .card{flex-direction:column;align-items:stretch}
      .actions{justify-content:space-between}
    }
    pre.debug{
      margin:0;
      font-size:13px;
      color:#9ca3af;
      background:transparent;
    }
  </style>
</head>
<body>
  <div class="card" role="main">
    <div class="brand">
      <h1>LOFT</h1>
      <p class="lead">Добро пожаловать в рабочее пространство — демо-страница.</p>
    </div>

    <div class="actions" aria-hidden="false">
      <a class="btn" href="/login">🔐 Вход</a>
      <a class="btn secondary" href="/dashboard">📊 Дашборд</a>
    </div>
  </div>
</body>
</html>
