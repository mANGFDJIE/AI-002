<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Киберпанк — Вход</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== СБРОС И БАЗА ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      color: #d0d0e0;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* ===== СЕТКА НА ФОНЕ ===== */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* ===== ИСКРЫ ===== */
    .sparkle {
      position: fixed;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      animation: sparkleFloat linear infinite;
      opacity: 0;
    }

    @keyframes sparkleFloat {
      0% {
        transform: translateY(0) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-120vh) scale(1);
        opacity: 0;
      }
    }

 ===== ГЛАВНЫЙ КОНТЕЙНЕР ===== */
    .cyber-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 40px;
      justify-content: center;
    }

    /* ===== ЛЕВАЯ ЧАСТЬ — ЛЕНДИНГ ===== */
    .hero {
      flex: 1 1 400px;
      min-width: 280px;
      text-align: center;
    }
    .hero .glitch {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(28px, 6vw, 56px);
      color: #f0f;
      text-shadow: 2px 0 cyan, -2px 0 magenta;
      margin-bottom: 12px;
      line-height: 1.3;
      position: relative;
      display: inline-block;
      animation: glitch-skew 4s infinite;
    }
    @keyframes glitch-skew {
      0%, 100% { transform: skew(0deg); }
      20% { transform: skew(2deg); }
      40% { transform: skew(-1deg); }
      60% { transform: skew(3deg); }
      80% { transform: skew(-2deg); }
    }
    .hero .sub {
      font-size: 18px;
      color: #80e0ff;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
      opacity: 0.8;
      text-shadow: 0 0 10px #00ffff66;
    }
    .hero .tagline {
      font-size: 15px;
      color: #b0b0c0;
      max-width: 360px;
      margin: 0 auto 20px;
      line-height: 1.6;
      border-left: 3px solid #f0f;
      padding-left: 16px;
    }
    .hero .neon-line {
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #0ff, transparent);
      margin: 20px auto;
      border-radius: 2px;
      box-shadow: 0 0 12px #0ff;
    }

    /* ===== ПРАВАЯ ЧАСТЬ — ФОРМА ВХОДА ===== */
    .login-card {
      flex: 0 1 380px;
      background: rgba(10, 10, 20, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 36px 30px 30px;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.15), inset 0 0 30px rgba(255, 0, 255, 0.03);
      position: relative;
    }
    .login-card::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 18px;
      background: linear-gradient(135deg, #0ff, #f0f, #0ff);
      opacity: 0.3;
      z-index: -1;
      filter: blur(4px);
    }
    .login-card h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 18px;
      text-align: center;
      color: #0ff;
      text-shadow: 0 0 12px #0ff;
      margin-bottom: 6px;
    }
    .login-card .subtitle {
      text-align: center;
      font-size: 13px;
      color: #8888aa;
      margin-bottom: 28px;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #a0a0c0;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: #0c0c18;
      border: 1px solid #3a3a5a;
      border-radius: 10px;
      color: #e0e0f0;
      font-size: 15px;
      font-family: 'Space Grotesk', sans-serif;
      outline: none;
      transition: all 0.25s;
    }
    .form-group input:focus {
      border-color: #0ff;
      box-shadow: 0 0 14px rgba(0, 255, 255, 0.3), inset 0 0 8px rgba(0, 255, 255, 0.05);
      background: #0a0a16;
    }
    .form-group input::placeholder {
      color: #3a3a5a;
    }

    .btn-cyber {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0ff, #00ccff);
      border: none;
      border-radius: 10px;
      color: #0a0a12;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
      position: relative;
      overflow: hidden;
    }
    .btn-cyber:hover {
      transform: scale(1.02);
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.6);
    }
    .btn-cyber:active {
      transform: scale(0.98);
    }
    .btn-cyber::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(255,255,255,0.03) 4px, rgba(255,255,255,0.03) 8px);
      pointer-events: none;
    }

    .message {
      min-height: 28px;
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.3s;
    }
    .message.error {
      color: #ff3377;
      text-shadow: 0 0 8px #ff337788;
    }
    .message.success {
      color: #00ff88;
      text-shadow: 0 0 8px #00ff8866;
    }

    .footer-link {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      border-top: 1px solid #1a1a2e;
      padding-top: 18px;
    }
    .footer-link a {
      color: #80aaff;
      text-decoration: none;
      transition: 0.2s;
      position: relative;
    }
    .footer-link a:hover {
      color: #0ff;
      text-shadow: 0 0 8px #0ff;
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 700px) {
      .cyber-wrap {
        flex-direction: column;
        gap: 20px;
      }
      .hero .glitch {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

  <div class="cyber-wrap">

    <!-- ЛЕНДИНГ -->
    <div class="hero">
      <h1 class="glitch">КИБЕРПАНК</h1>
      <div class="sub">// 2084 · НОВЫЙ РАССВЕТ //</div>
      <div class="neon-line"></div>
      <p class="tagline">
        Войди в сеть будущего. Доступ к полному спектру нейро-интерфейсов, 
        </br>цифровым архивам и кибер-пространству.
      </p>
    </div>

    <!-- ФОРМА ВХОДА -->
    <div class="login-card">
      <h2>🔐 LOGIN</h2>
      <p class="subtitle">идентификация пользователя</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Логин</label>
          <input type="text" id="username" name="username" placeholder="ваш ID" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-cyber">Войти</button>
      </form>

      <div id="message" class="message"></div>

      <div class="footer-link">
        <a href="#">Забыли пароль? / Регистрация</a>
      </div>
    </div>

  </div>

  <script>
    // ===== ИСКРЫ =====
    (function createSparkles() {
      const colors = ['#0ff', '#f0f', '#80e0ff', '#ff66aa', '#00ff88'];
      const container = document.body;
      for (let i = 0; i < 30; i++) {
        const spark = document.createElement('div');
        spark.className = 'sparkle';
        const size = Math.random() * 4 + 2;
        spark.style.width = size + 'px';
        spark.style.height = size + 'px';
        spark.style.background = colors[Math.floor(Math.random() * colors.length)];
        spark.style.left = Math.random() * 100 + '%';
        spark.style.top = Math.random() * 100 + '%';
        spark.style.animationDuration = (Math.random() * 8 + 6) + 's';
        spark.style.animationDelay = (Math.random() * 10) + 's';
        spark.style.boxShadow = `0 0 ${size * 2}px ${spark.style.background}`;
        container.appendChild(spark);
      }
    })();

    // ===== ФОРМА =====
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('message');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        msg.className = 'message error';
        msg.textContent = '⚠ Ошибка: все поля должны быть заполнены';
        return;
      }

      // Имитация входа
      msg.className = 'message success';
      msg.textContent = `✅ Добро пожаловать в сеть, ${username} (демо-доступ)`;
    });
  </script>

</body>
</html>
